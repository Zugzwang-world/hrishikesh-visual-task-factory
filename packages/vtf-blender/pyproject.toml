[project]
name = "vtf-blender"
version = "0.0.1"
description = "Blender renderer for the Visual Task Factory. Runs inside Blender's own Python; talks to vtf only through files."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtf_blender"]
