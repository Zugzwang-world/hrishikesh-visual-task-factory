[project]
name = "vtf"
version = "0.0.1"
description = "Visual Task Factory core: scene spec, question programs, validation gates, evaluation. Never imports bpy."
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.29"]

[project.scripts]
vtf = "vtf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtf"]
