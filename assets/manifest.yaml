# Asset manifest (contract: vtf.core.assets.AssetManifest, version 0.1.0).
#
# Every object the sampler may place. Poly Haven models are CC0 and fetched as glTF (1k textures)
# into the asset cache (assets/cache/<id>/, gitignored; $VTF_ASSET_CACHE overrides the folder).
# `uv run python assets/fetch_manifest.py` fills the cache for every entry below (it calls
# fetch_polyhaven.py and derives the rest-pose files of rest_pose.py). Procedural primitives of
# exact size are scale references.
#
# Mesh convention: glTF +Y up becomes +Z up, times `scale`, centred on the bounding box (see
# vtf.core.assets). size_m is the real extent x, y, z after that, in metres, measured from the
# mesh with `uv run python assets/measure_assets.py <id>` (which also cross-checks meta.json,
# reports triangles and the mean base colour, and measures container interiors by ray casting).
# Poly Haven models are real scale; a few large ones are scaled down to fit a 1.0 x 0.7 m table
# (scale < 1).
#
# Collision: convex_hull for movable objects; mesh plus passive: true for open containers (they
# never move in the settle and rest on the table top). Container interiors are in the asset's
# centred local frame, heights above its lowest point.
#
# Models made upright (a screwdriver on its handle, a lemon on its tip) point `file` at a
# rest-pose variant lying on its side (assets/rest_pose.py), so the modelled orientation plus a
# yaw is always a stable resting pose. colour_name is the word a person would use for the whole
# object; null when there is none (multi-coloured or metallic).
#
# Blender has no YAML reader: after editing, run `uv run python assets/export_manifest_json.py`
# to refresh assets/manifest.json (a test checks it is current).

