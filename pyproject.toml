[project]
name = "vtf-workspace"
version = "0.0.0"
description = "Workspace root for the Visual Task Factory (vtf core + vtf-blender renderer)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["vtf", "vtf-blender"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "matplotlib>=3.11.2",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vtf = { workspace = true }
vtf-blender = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["out", "renders", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option/Argument defaults are the Typer idiom

[tool.ruff.lint.isort]
known-first-party = ["vtf", "vtf_blender"]
